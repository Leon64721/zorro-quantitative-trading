<h2>sqrt(var x): var
</h2>
		Square root of <span>x</span>.<h3>Parameters:</h3>
		<strong>x</strong>         
  - any <strong>var</strong>.<br>
		<h3>Returns:</h3>
		
    Square root of x.
    <h3>Example:</h3>		
    <pre>x = sqrt(2); <em>// x is now 1.414</em>
x = sqrt(64); <em>// x is now 8 </em>
x = sqrt(1); <em>// x is now 1 </em></pre>
