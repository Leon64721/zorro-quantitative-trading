<h2>abs(int x): int</h2>
<h2>abs(var x): var</h2>
		Absolute amount of <strong>x</strong>.
		<h3>Parameters:</h3>
		<strong>x</strong>      - any <strong>var</strong> or <strong>int</strong>.<br>
		<h3>Returns:</h3>
		<table border="0" cellspacing="2" cellpadding="2">
          <tr>
            <td><strong>x &gt;= 0</strong></td>
            <td>then <span > x</span></td>
          </tr>
          <tr>
            <td><strong>x &lt; 0</strong></td>
            <td>then&nbsp; <span > -x</span></td>
          </tr>
        </table>
		<h3>Example:</h3>
		<pre>x = abs(2); <em>// x is now 2</em>
x = abs(-599); <em>// x is now 599</em> 
x = abs(0); <em>// x is now 0 </em></pre>
