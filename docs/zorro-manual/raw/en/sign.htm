<h2>sign(int x): int</h2>
<h2>sign(var x): var</h2>
		The sign of <strong>x</strong>: <strong>-1</strong>, <strong>0</strong>, or <strong>1</strong>.
		<h3>Parameters:</h3>
		<strong>x</strong>      - any <strong>var</strong> or <strong>int</strong>.<br>
		<h3>Returns:</h3>
		<table border="0" cellspacing="2" cellpadding="2">
          <tr>
            <td><strong>x &gt; 0</strong></td>
            <td><strong>1</strong></td>
          </tr>
          <tr>
            <td><strong>x == 0 </strong></td>
            <td><strong>0</strong></td>
          </tr>
          <tr>
            <td><strong>x &lt; 0</strong></td>
            <td><strong>-1</strong></td>
          </tr>
        </table>
		<h3>Example:</h3>
		<pre>x = sign(2); <em>// x is now 1</em>
x = sign(-599); <em>// x is now -1 </em>
x = sign(0); <em>// x is now 0 </em></pre>
